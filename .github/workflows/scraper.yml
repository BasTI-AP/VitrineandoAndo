name: Actualizar Precios Falabella

on:
  schedule:
    # Corre a las 11 PM, 3 AM, 5 AM, 12 PM, 4 PM y 8 PM (hora de Chile)
    - cron: '0 2,6,8,15,19,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrap:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del scraper
        working-directory: ./VitrineandoAndo/backend
        run: npm install

      - name: Ejecutar scraping y generar productos.json
        working-directory: ./VitrineandoAndo/backend
        run: node scraper-batch.js

      - name: Guardar cambios en el repositorio
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add VitrineandoAndo/productos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Actualizar precios automáticamente" && git push)
