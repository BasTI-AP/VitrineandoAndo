name: Bot Scraper Multi-Tienda

on:
  schedule:
    - cron: '0 */6 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrapear:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias y Playwright
        run: |
          npm install
          npx playwright install chromium

      - name: Ejecutar bot en las 5 tiendas
        run: node scraper-batch.js

      - name: Guardar cambios en productos.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add productos.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Bot: precios actualizados"
          git push
